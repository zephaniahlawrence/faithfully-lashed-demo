<div id="adminpanel" name="adminpanel" class="adminpanel" style="display:grid;">
    <div id="adminuserdisplay" name="adminuserdisplay" class="adminuserdisplay">
        <select id="userselector" name="userselector" style="display:grid; font-family: 'Fjalla One'; margin-bottom: 14px; width:100%; max-width:100%; background:transparent; border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0px 1px 8px rgba(0, 0, 0, 0.24); color:var(--primarytextcolor); border-radius: 9px; padding:8px; font-size:14px;">
            <option value="Select User" style="text-align:left" selected>Select User</option>
        </select>
        <div id="displayuser" name="displayuser" class="displayuser" style="display:none; border:2px none red;"></div>
        <!-- <object width="100%" height="500px" data="{{ url_for('birthday', filename='templates/birthday.html') }}"></object> -->
        <!-- <br> -->
        <div style="display:flex; margin-top:11px; gap:8px;">
            <!-- <button class="buttonhover" style="width:100%; background:transparent; color:var(--primarytextcolor); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 0 8px rgba(0, 0, 0, 0.24); border-radius:4px; padding:4px;">New User</button> &nbsp; -->
            <button class="buttonhover" style="width:100%; background:transparent; color:var(--primarytextcolor); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 0 8px rgba(0, 0, 0, 0.24); border-radius:4px; padding:4px;">Edit User</button>
            <button class="buttonhover" style="width:100%; background:transparent; color:var(--primarytextcolor); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 0 8px rgba(0, 0, 0, 0.24); border-radius:4px; padding:4px;">Delete User</button>
        </div>
        <button class="buttonhover" style="margin-top:8px; margin-bottom:0px; width:100%; background:transparent; color:var(--primarytextcolor); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 0 8px rgba(0, 0, 0, 0.24); border-radius:4px; padding:4px;">Save User</button>
    </div>



    <div id="messengerwindow-admin" class="messengerwindow-admin">
        <div id="messengerdisplay" class="messengerdisplay">
            <div id="messengerdisplay-padding" class="messengerdisplay-padding">

                <form name="messagerdisplay-existingchatroom-form" class="messagerdisplay-existingchatroom-form">
                    <button id="fl0000" name="messagerdisplay-existingchat" class="messagerdisplay-existingchat" type="submit">

                        <div class="existingchat-content">
                            <p class="existingchat-content-title"><b>Faithfully Lashed Studio</b></p>
                            <p class="existingchat-content-subtitle">Need help booking or choosing a set?</p>
                        </div>
                    </button>
                </form>

                <div id="messagerdisplay-chatroom" name="messagerdisplay-chatroom" class="messagerdisplay-chatroom" style="grid-area:item-3;">
                    <div class="chatroom-content">
                        <div class="chatroom-display">
                            <h2 class="chatroom-id">Room ID: <span id="chatroom-roomcode" name="chatroom-roomcode" class="chatroom-roomcode"></span></h2>
                            <div id="chatroom-messages-display" name="chatroom-messages-display" class="chatroom-messages-display"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

            </form>

            <form id="newmessageform" name="newmessageform" class="newmessageform">
                <input id="messengertools-messageinput" name="messengertools-messageinput" class="messengertools-messageinput" placeholder="message..." type="text" rows="3">
                <button id="messengertools-sendmessage-btn" name="messengertools-sendmessage-btn" class="messengertools-sendmessage-btn messengerbtn-hover messengersvg-hover2">

                </button>

            <button class="messengertools-closemessenger-btn messengertools-endchatroom-switch messengerbtn-hover endchat">&#10008;</button>
        </div>
    </div>





</div>
